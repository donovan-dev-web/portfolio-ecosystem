version: "3.9"

services:
  mongo:
    image: mongo:latest
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Backend-proto/Dockerfile
    container_name: backend_app
    ports:
      - "3000:3000"
    volumes:
      - ./Backend-proto:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    env_file:
      - ./Backend-proto/.env
    command: npm run dev
    depends_on:
      - mongo

volumes:
  mongo_data:
